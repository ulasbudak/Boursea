[project]
name = "boursea-api"
version = "0.1.0"
description = "Boursea backend API"
license = { text = "Proprietary" }
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.53.0",
    "pydantic-settings==2.15.0",
    "psycopg[binary]==3.3.5",
    "pyjwt[crypto]==2.14.0",
    "httpx==0.28.1",
    # Story 9.2 — technical analysis AI report (ChartScanAI/YOLOv8 chart-pattern model).
    # First ML dependency in this API; opencv-python-headless (not opencv-python) avoids
    # needing a system libGL install for a server with no display.
    "ultralytics==8.4.155",
    "mplfinance==0.12.10b0",
    "opencv-python-headless==5.0.0.93",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "httpx2==2.13.0",
    "ruff==0.16.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
