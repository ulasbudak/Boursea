name: Keep API warm

# Render's free tier spins the API down after 15 minutes without traffic, and the first
# request afterwards waits for a cold start. Pinging every 10 minutes keeps one instance
# up around the clock (~744 h/month, inside the free tier's 750 instance-hours).
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /health
        run: curl --fail --silent --show-error --max-time 120 --retry 2 https://trendus-api.onrender.com/health
